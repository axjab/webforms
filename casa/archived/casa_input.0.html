<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>casa — property tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

/* ── tokens ─────────────────────────────────────── */
:root {
  --bg:      #111318;
  --surface: #1c2030;
  --border:  #2e3554;
  --text:    #dde2f0;
  --muted:   #8892b0;
  --accent:  #7c9cff;
  --green:   #3fb950;
  --red:     #f85149;
  --amber:   #d29922;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'Inter', system-ui, sans-serif;
}

/* ── reset ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

/* ── typography ──────────────────────────────────── */
.mono { font-family: var(--mono); }

/* ── header ──────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-logo {
  font-family: var(--mono); font-size: 18px; font-weight: 700;
  letter-spacing: 3px; color: var(--text); text-transform: uppercase;
}
.header-right { position: relative; }

/* ── auth badge ──────────────────────────────────── */
.auth-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 20px; cursor: pointer;
  font-size: 12px; font-weight: 600; user-select: none;
  border: 1px solid var(--red);
  background: rgba(248,81,73,0.08);
  color: var(--red);
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.auth-badge.authenticated {
  border-color: var(--green);
  background: rgba(63,185,80,0.08);
  color: var(--green);
}
.auth-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red); flex-shrink: 0;
  transition: background 0.2s;
}
.auth-badge.authenticated .auth-dot {
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: breathe 2.5s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: 1; } 50% { opacity: 0.35; }
}
.auth-signout {
  margin-left: 4px; opacity: 0.5; font-size: 11px;
  cursor: pointer; padding: 2px 4px;
}
.auth-signout:hover { opacity: 1; }

/* ── login panel ─────────────────────────────────── */
.login-panel {
  display: none;
  position: absolute; top: calc(100% + 8px); right: 0;
  width: 240px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px;
  flex-direction: column; gap: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.login-panel.open { display: flex; }
.login-panel-title {
  font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
}
.login-error {
  font-size: 11px; color: var(--red); display: none;
}

/* ── main layout ─────────────────────────────────── */
.main { max-width: 700px; margin: 0 auto; padding: 28px 24px 100px; }
.connection-hint {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  letter-spacing: 0.5px; margin-bottom: 24px;
}

/* ── status bar ──────────────────────────────────── */
.status-bar {
  display: none;
  padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
  font-size: 13px;
}
.status-bar.visible { display: flex; justify-content: space-between; align-items: center; }
.status-bar.success { background: rgba(63,185,80,0.08); border: 1px solid var(--green); color: var(--green); }
.status-bar.error   { background: rgba(248,81,73,0.08); border: 1px solid var(--red); color: var(--red); }
.status-close { cursor: pointer; opacity: 0.6; font-size: 16px; line-height: 1; }
.status-close:hover { opacity: 1; }

/* ── form sections ───────────────────────────────── */
.section { margin-bottom: 28px; }
.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1.8px;
  text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
}
.divider { height: 1px; background: var(--border); margin: 0 0 24px; }

/* ── field ───────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 11px; font-weight: 500; color: var(--muted); }
.field-label .req { color: var(--accent); margin-left: 2px; }

/* ── inputs ──────────────────────────────────────── */
input[type=text], input[type=url], input[type=email],
input[type=password], input[type=number], input[type=date],
select, textarea {
  width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  padding: 8px 10px; font-size: 13px; font-family: var(--sans);
  outline: none; transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: #4a5378; }
textarea { resize: vertical; min-height: 72px; }
input[type=number] { font-family: var(--mono); }
select { cursor: pointer; }
/* hide number spinners */
input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }

/* ── grids ───────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ── chips ───────────────────────────────────────── */
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 5px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); user-select: none;
  transition: all 0.15s; font-family: var(--sans);
}
.chip.active {
  border-color: var(--accent);
  background: rgba(124,156,255,0.12);
  color: var(--accent);
}

/* ── cost other ──────────────────────────────────── */
.cost-other-row {
  display: flex; gap: 8px; margin-bottom: 6px; align-items: center;
}
.cost-other-row input[type=text]  { flex: 2; }
.cost-other-row input[type=number] { flex: 1; }
.btn-remove-other {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--muted); cursor: pointer; padding: 7px 10px;
  font-size: 16px; line-height: 1; flex-shrink: 0;
  transition: color 0.15s, border-color 0.15s;
}
.btn-remove-other:hover { color: var(--red); border-color: var(--red); }
.btn-add-other {
  font-size: 12px; font-weight: 600; color: var(--accent);
  background: none; border: 1px dashed var(--border);
  border-radius: 6px; padding: 6px 14px; cursor: pointer;
  margin-top: 4px; transition: border-color 0.15s;
}
.btn-add-other:hover { border-color: var(--accent); }

/* ── cost total ──────────────────────────────────── */
.cost-total-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; margin-top: 16px;
}
.cost-total-label {
  font-size: 11px; font-weight: 600; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--muted);
}
.cost-total-value {
  font-family: var(--mono); font-size: 22px; font-weight: 700;
  color: var(--green); transition: color 0.2s;
}
.cost-total-value.warn  { color: var(--amber); }
.cost-total-value.over  { color: var(--red); }

/* ── submit button ───────────────────────────────── */
.btn-submit {
  width: 100%; padding: 13px; border-radius: 8px; border: none;
  font-size: 14px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer;
  background: var(--accent); color: #111318;
  transition: opacity 0.15s;
}
.btn-submit:hover { opacity: 0.88; }
.btn-submit.dry-run {
  background: var(--amber);
}

/* ── dry run panel ───────────────────────────────── */
.dry-run-panel {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #16192a; border-top: 2px solid var(--amber);
  padding: 14px 24px 18px; max-height: 42vh; overflow-y: auto; z-index: 200;
}
.dry-run-panel.open { display: block; }
.dry-run-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.dry-run-title {
  font-size: 11px; font-weight: 700; color: var(--amber);
  letter-spacing: 1.5px; text-transform: uppercase;
}
.btn-close-dry-run {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px;
}
.btn-close-dry-run:hover { color: var(--text); }
.dry-run-pre {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  white-space: pre-wrap; word-break: break-all;
}

/* ── misc ────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════ -->
<header class="header">
  <span class="header-logo">Casa</span>
  <div class="header-right">
    <div class="auth-badge" id="auth-badge" onclick="toggleLoginPanel()">
      <span class="auth-dot" id="auth-dot"></span>
      <span id="auth-label">NOT AUTHENTICATED</span>
      <span class="auth-signout" id="auth-signout" style="display:none" onclick="logout(event)">✕</span>
    </div>
    <div class="login-panel" id="login-panel">
      <div class="login-panel-title">Sign in</div>
      <input type="email" id="login-email" placeholder="Email" />
      <input type="password" id="login-password" placeholder="Password" onkeydown="if(event.key==='Enter') login()" />
      <div class="login-error" id="login-error"></div>
      <button class="btn-submit" onclick="login()" id="login-btn">Sign in</button>
    </div>
  </div>
</header>

<!-- ══ MAIN ════════════════════════════════════════════ -->
<main class="main">

  <div class="connection-hint" id="connection-hint">→ Not connected — submit will dry run</div>

  <div class="status-bar" id="status-bar">
    <span id="status-msg"></span>
    <span class="status-close" onclick="closeStatus()">✕</span>
  </div>

  <!-- IDENTITY ─────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Identity</div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div class="field">
        <label class="field-label">Address <span class="req">*</span></label>
        <input type="text" id="address" placeholder="44 Ontario Street, Ottawa" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label">URL</label>
          <input type="url" id="url" placeholder="https://rentals.ca/…" />
        </div>
        <div class="field">
          <label class="field-label">Contact</label>
          <input type="text" id="contact" placeholder="Jane @ (613) 555-0101" />
        </div>
      </div>
    </div>
  </section>
  <div class="divider"></div>

  <!-- LOCATION ─────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Location</div>
    <div class="grid-3">
      <div class="field">
        <label class="field-label">Latitude</label>
        <input type="number" id="lat" step="any" placeholder="45.4231" />
      </div>
      <div class="field">
        <label class="field-label">Longitude</label>
        <input type="number" id="lon" step="any" placeholder="-75.6892" />
      </div>
      <div class="field">
        <label class="field-label">Distance from ref</label>
        <input type="number" id="distance_from_ref" placeholder="km" />
      </div>
    </div>
  </section>
  <div class="divider"></div>

  <!-- UNIT ─────────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Unit</div>
    <div class="grid-2">
      <div class="field">
        <label class="field-label">Laundry type</label>
        <select id="laundry_type">
          <option value="shared">Shared</option>
          <option value="in-unit">In-unit</option>
          <option value="none">None</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Move-in date</label>
        <input type="date" id="move_in" />
      </div>
    </div>
  </section>
  <div class="divider"></div>

  <!-- AMENITIES ────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Amenities</div>
    <div class="chip-row">
      <button type="button" class="chip" data-field="has_parking">Parking</button>
      <button type="button" class="chip" data-field="parking_nearby">Parking nearby</button>
      <button type="button" class="chip" data-field="has_storage">Storage</button>
      <button type="button" class="chip" data-field="has_gym">Gym</button>
      <button type="button" class="chip" data-field="has_pool">Pool</button>
      <button type="button" class="chip" data-field="is_furnished">Furnished</button>
    </div>
  </section>
  <div class="divider"></div>

  <!-- COSTS ────────────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Monthly costs</div>
    <div class="grid-3" style="margin-bottom:12px;">
      <div class="field">
        <label class="field-label">Base <span class="req">*</span></label>
        <input type="number" id="cost_base" placeholder="0" oninput="updateTotal()" />
      </div>
      <div class="field">
        <label class="field-label">Heat</label>
        <input type="number" id="cost_heat" value="80" oninput="updateTotal()" />
      </div>
      <div class="field">
        <label class="field-label">Water</label>
        <input type="number" id="cost_water" value="0" oninput="updateTotal()" />
      </div>
      <div class="field">
        <label class="field-label">Power</label>
        <input type="number" id="cost_power" value="80" oninput="updateTotal()" />
      </div>
      <div class="field">
        <label class="field-label">Internet</label>
        <input type="number" id="cost_internet" value="65" oninput="updateTotal()" />
      </div>
      <div class="field">
        <label class="field-label">Laundry</label>
        <input type="number" id="cost_laundry" value="35" oninput="updateTotal()" />
      </div>
      <div class="field">
        <label class="field-label">Parking</label>
        <input type="number" id="cost_parking" value="0" oninput="updateTotal()" />
      </div>
    </div>

    <!-- cost_other ──────────────────────────────────── -->
    <div style="margin-bottom:8px;">
      <div class="field-label" style="margin-bottom:8px;">Other expenses</div>
      <div id="cost-other-rows"></div>
      <button type="button" class="btn-add-other" onclick="addCostOther()">+ Add expense</button>
    </div>

    <!-- total ───────────────────────────────────────── -->
    <div class="cost-total-row">
      <span class="cost-total-label">Monthly total</span>
      <span class="cost-total-value mono" id="cost-total">$260</span>
    </div>
  </section>
  <div class="divider"></div>

  <!-- EVALUATION ───────────────────────────────────── -->
  <section class="section">
    <div class="section-label">Evaluation</div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div class="grid-2">
        <div class="field">
          <label class="field-label">Nabila's rating (1–10)</label>
          <input type="number" id="nabila_rating" min="1" max="10" placeholder="—" />
        </div>
        <div class="field">
          <label class="field-label">Score (computed)</label>
          <input type="number" id="score" placeholder="—" />
        </div>
      </div>
      <div class="field">
        <label class="field-label">Reviews</label>
        <textarea id="reviews" placeholder="Google reviews summary…"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Assessment <span style="color:var(--muted); font-size:10px;">(HTML)</span></label>
        <textarea id="assessment" placeholder="Verdict after viewing…"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Notes <span style="color:var(--muted); font-size:10px;">(HTML)</span></label>
        <textarea id="notes" placeholder="Anything else…"></textarea>
      </div>
    </div>
  </section>

  <!-- SUBMIT ───────────────────────────────────────── -->
  <button type="button" class="btn-submit dry-run" id="btn-submit" onclick="submit()">
    ⚠ Dry run — not authenticated
  </button>

</main>

<!-- ══ DRY RUN PANEL ════════════════════════════════ -->
<div class="dry-run-panel" id="dry-run-panel">
  <div class="dry-run-header">
    <span class="dry-run-title">⚠ Dry run — POST payload (not saved)</span>
    <button class="btn-close-dry-run" onclick="closeDryRun()">✕</button>
  </div>
  <pre class="dry-run-pre" id="dry-run-pre"></pre>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════ */
const BASE_URL = 'http://majula:9000';

/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */
let authToken = null;
let authUser  = null;

/* ═══════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════ */
function toggleLoginPanel() {
  if (authToken) return; // badge click does nothing when authenticated
  document.getElementById('login-panel').classList.toggle('open');
}

async function login() {
  const identity = document.getElementById('login-email').value.trim();
  const password  = document.getElementById('login-password').value;
  const errEl     = document.getElementById('login-error');
  const btn       = document.getElementById('login-btn');

  errEl.style.display = 'none';
  btn.textContent = 'Signing in…';
  btn.disabled = true;

  try {
    const res  = await fetch(`${BASE_URL}/api/collections/users/auth-with-password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ identity, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Authentication failed');

    authToken = data.token;
    authUser  = data.record;
    updateAuthUI();
    document.getElementById('login-panel').classList.remove('open');
  } catch (err) {
    errEl.textContent    = err.message;
    errEl.style.display  = 'block';
  } finally {
    btn.textContent = 'Sign in';
    btn.disabled    = false;
  }
}

function logout(event) {
  event.stopPropagation();
  authToken = null;
  authUser  = null;
  updateAuthUI();
}

function updateAuthUI() {
  const badge     = document.getElementById('auth-badge');
  const label     = document.getElementById('auth-label');
  const signout   = document.getElementById('auth-signout');
  const hint      = document.getElementById('connection-hint');
  const submitBtn = document.getElementById('btn-submit');

  if (authToken) {
    badge.classList.add('authenticated');
    label.textContent    = authUser?.name || authUser?.email || 'Authenticated';
    signout.style.display = 'inline';
    hint.textContent     = `→ Connected to majula:9000`;
    submitBtn.textContent = 'Save property';
    submitBtn.classList.remove('dry-run');
  } else {
    badge.classList.remove('authenticated');
    label.textContent    = 'NOT AUTHENTICATED';
    signout.style.display = 'none';
    hint.textContent     = `→ Not connected — submit will dry run`;
    submitBtn.textContent = '⚠ Dry run — not authenticated';
    submitBtn.classList.add('dry-run');
  }
}

/* ═══════════════════════════════════════════════════════
   CHIP TOGGLES
═══════════════════════════════════════════════════════ */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => chip.classList.toggle('active'));
});

function getChipValue(fieldName) {
  const chip = document.querySelector(`.chip[data-field="${fieldName}"]`);
  return chip ? chip.classList.contains('active') : false;
}

/* ═══════════════════════════════════════════════════════
   COST OTHER
═══════════════════════════════════════════════════════ */
function addCostOther() {
  const container = document.getElementById('cost-other-rows');
  const row = document.createElement('div');
  row.className = 'cost-other-row';
  row.innerHTML = `
    <input type="text"   placeholder="label (e.g. storage)" />
    <input type="number" placeholder="0" oninput="updateTotal()" />
    <button type="button" class="btn-remove-other" onclick="removeCostOther(this)">−</button>
  `;
  container.appendChild(row);
}

function removeCostOther(btn) {
  btn.parentElement.remove();
  updateTotal();
}

function getCostOther() {
  const result = {};
  document.querySelectorAll('#cost-other-rows .cost-other-row').forEach(row => {
    const [labelInput, valueInput] = row.querySelectorAll('input');
    const key = labelInput.value.trim();
    const val = parseFloat(valueInput.value) || 0;
    if (key) result[key] = val;
  });
  return result;
}

/* ═══════════════════════════════════════════════════════
   COST TOTAL
═══════════════════════════════════════════════════════ */
function updateTotal() {
  const costFields = ['cost_base','cost_heat','cost_water','cost_power',
                      'cost_internet','cost_laundry','cost_parking'];

  let total = costFields.reduce((sum, id) => {
    return sum + (parseFloat(document.getElementById(id).value) || 0);
  }, 0);

  // add cost_other values
  document.querySelectorAll('#cost-other-rows .cost-other-row input[type=number]').forEach(input => {
    total += parseFloat(input.value) || 0;
  });

  const el = document.getElementById('cost-total');
  el.textContent = `$${total.toFixed(0)}`;
  el.classList.remove('warn', 'over');
  if (total > 1500) el.classList.add('over');
  else if (total > 1300) el.classList.add('warn');
}

/* ═══════════════════════════════════════════════════════
   BUILD PAYLOAD
═══════════════════════════════════════════════════════ */
function buildPayload() {
  const get   = id => document.getElementById(id).value.trim();
  const num   = id => { const v = get(id); return v !== '' ? parseFloat(v) : undefined; };
  const text  = id => get(id) || undefined;

  const lat = get('lat');
  const lon = get('lon');

  const payload = {
    address:          get('address'),
    url:              text('url'),
    contact:          text('contact'),
    coordinates:      (lat && lon) ? { lat: parseFloat(lat), lon: parseFloat(lon) } : undefined,
    distance_from_ref: num('distance_from_ref'),
    has_parking:      getChipValue('has_parking'),
    parking_nearby:   getChipValue('parking_nearby'),
    has_storage:      getChipValue('has_storage'),
    has_gym:          getChipValue('has_gym'),
    has_pool:         getChipValue('has_pool'),
    is_furnished:     getChipValue('is_furnished'),
    laundry_type:     get('laundry_type'),
    cost_base:        num('cost_base'),
    cost_heat:        num('cost_heat') ?? 0,
    cost_water:       num('cost_water') ?? 0,
    cost_power:       num('cost_power') ?? 0,
    cost_internet:    num('cost_internet') ?? 0,
    cost_laundry:     num('cost_laundry') ?? 0,
    cost_parking:     num('cost_parking') ?? 0,
    cost_other:       getCostOther(),
    reviews:          text('reviews'),
    assessment:       text('assessment'),
    notes:            text('notes'),
    nabila_rating:    num('nabila_rating'),
    move_in:          text('move_in'),
    score:            num('score'),
  };

  // remove undefined keys to keep payload clean
  return Object.fromEntries(Object.entries(payload).filter(([, v]) => v !== undefined));
}

/* ═══════════════════════════════════════════════════════
   SUBMIT
═══════════════════════════════════════════════════════ */
async function submit() {
  closeStatus();

  if (!document.getElementById('address').value.trim()) {
    showStatus('error', 'Address is required.');
    return;
  }
  if (!document.getElementById('cost_base').value) {
    showStatus('error', 'Base cost is required.');
    return;
  }

  const payload = buildPayload();

  // ── dry run ──────────────────────────────────────────
  if (!authToken) {
    document.getElementById('dry-run-pre').textContent = JSON.stringify(payload, null, 2);
    document.getElementById('dry-run-panel').classList.add('open');
    return;
  }

  // ── actual POST ──────────────────────────────────────
  const btn = document.getElementById('btn-submit');
  btn.disabled    = true;
  btn.textContent = 'Saving…';

  try {
    const res  = await fetch(`${BASE_URL}/api/collections/casa_properties/records`, {
      method:  'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': authToken,
      },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'POST failed');

    showStatus('success', `Saved — record ${data.id}`);
    resetForm();
  } catch (err) {
    showStatus('error', err.message);
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Save property';
  }
}

/* ═══════════════════════════════════════════════════════
   RESET FORM
═══════════════════════════════════════════════════════ */
function resetForm() {
  ['address','url','contact','lat','lon','distance_from_ref',
   'cost_base','reviews','assessment','notes','nabila_rating','move_in','score']
    .forEach(id => document.getElementById(id).value = '');

  document.getElementById('cost_heat').value     = '80';
  document.getElementById('cost_water').value    = '0';
  document.getElementById('cost_power').value    = '80';
  document.getElementById('cost_internet').value = '65';
  document.getElementById('cost_laundry').value  = '35';
  document.getElementById('cost_parking').value  = '0';
  document.getElementById('laundry_type').value  = 'shared';
  document.getElementById('cost-other-rows').innerHTML = '';
  document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
  updateTotal();
}

/* ═══════════════════════════════════════════════════════
   DRY RUN PANEL
═══════════════════════════════════════════════════════ */
function closeDryRun() {
  document.getElementById('dry-run-panel').classList.remove('open');
}

/* ═══════════════════════════════════════════════════════
   STATUS BAR
═══════════════════════════════════════════════════════ */
function showStatus(type, msg) {
  const bar = document.getElementById('status-bar');
  document.getElementById('status-msg').textContent = msg;
  bar.className = `status-bar visible ${type}`;
  bar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeStatus() {
  document.getElementById('status-bar').className = 'status-bar';
}

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
updateTotal();
updateAuthUI();

// close login panel when clicking outside
document.addEventListener('click', e => {
  const panel = document.getElementById('login-panel');
  const badge = document.getElementById('auth-badge');
  if (panel.classList.contains('open') && !badge.contains(e.target)) {
    panel.classList.remove('open');
  }
});
</script>
